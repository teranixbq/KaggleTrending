name: Daily Kaggle Trending Fetch

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight UTC
  push:
    branches:
      - main
  workflow_dispatch:      # Allows manual trigger

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch trending datasets
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          # The kaggle library needs KAGGLE_USERNAME and KAGGLE_KEY.
          # We extract these from the KAGGLE_API_TOKEN (format: KGAT_username:key or similar)
          # However, often the token itself IS the key.
          # Let's set up the environment variables correctly for the legacy library.
          # For public datasets, we can also try to set a dummy username if the token is just the key.
          export KAGGLE_USERNAME="teranixbq"
          export KAGGLE_KEY="$KAGGLE_API_TOKEN"
          python fetch_trending.py

      - name: Commit and push if changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add daily trending datasets: $(date +'%Y-%m-%d')"
            git push
          fi
